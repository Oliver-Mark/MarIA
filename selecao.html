<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MarIA - Medicina Especializada</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
        <script src="https://unpkg.com/@phosphor-icons/web"></script>
        <link rel="stylesheet" href="css/selecao.css">
        <link rel="stylesheet" href="css/global-tema.css">
        <script src="Js/tema.js"></script>
    </head>
    <body>
        <div class="container">
            <section id="capa">
                <img src="img/Tela selecao.jpeg" alt="seleção" class="img-seleção">
            </section>
        <section id="drops">
            <img src="img/Logo-Maria-preto.png" alt="Logo">
            <div class="cont-selecao">
                <h1>Sede</h1>
                <div class="campo">
                    <label for="clinica">Unidade</label><br>
                    <select id="clinica" name="clinica" class="select-estilizado" required>
                        <option value="" disabled selected>Selecione a clínica</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="consultorio">Consultório</label><br>
                    <select id="consultorio" name="consultorio" class="select-estilizado" required>
                        <option value="" disabled selected>Selecione o consultório</option>
                    </select>
                </div>
                <button type="button" class="btn-continuar" onclick="window.location.href='tela_inicial.html'">
                    Acessar
                </button>
            </div>            
        </section>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const clinicaSelect = document.getElementById('clinica'); 
            const consultorioSelect = document.getElementById('consultorio'); 
        
            if (clinicaSelect && consultorioSelect) {
                const clinicasCadastradas = JSON.parse(localStorage.getItem('clinicas_maria')) || [];
                
                clinicaSelect.innerHTML = '<option value="" disabled selected>Selecione a clínica</option>';
                
                clinicasCadastradas.forEach((clinica, index) => {
                    clinicaSelect.innerHTML += `<option value="${index}">${clinica.nome}</option>`;
                });
        
                clinicaSelect.addEventListener('change', (e) => {
                    const indexSelecionado = e.target.value;
                    consultorioSelect.innerHTML = '<option value="" disabled selected>Selecione o consultório</option>';
                    
                    if (indexSelecionado !== "") {
                        const qtdConsultorios = clinicasCadastradas[indexSelecionado].qtdConsultorios;
                        for (let i = 1; i <= qtdConsultorios; i++) {
                            consultorioSelect.innerHTML += `<option value="consultorio${i}">Consultório ${i}</option>`;
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
