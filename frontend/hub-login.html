{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar • MarIA</title>
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
  <link rel="stylesheet" href="{% static 'css/hub.css' %}">
  <script type="module" src="{% static 'Js/hub-login.js' %}"></script>
</head>
<body class="hub-login">
  <div class="container">
    <section id="capa"><img src="{% static 'img/Tela inicial.jpeg' %}" alt=""></section>
    <section id="login">
      <img src="{% static 'img/Logo-Maria-preto.png' %}" alt="MarIA">
      <form id="hub-login" class="cont-login">
        <h1>Entrar no MarIA</h1><p>Continuidade do cuidado, onde você estiver.</p>
        <label class="campo">Usuário<input name="username" autocomplete="username" required></label>
        <label class="campo">Senha<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn" type="submit">Acessar</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
      <p>Protótipo acadêmico • utilize somente dados fictícios.</p>
    </section>
  </div>
</body>
</html>
