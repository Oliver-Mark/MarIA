<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MarIA - Medicina Especializada</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
        <script src="https://unpkg.com/@phosphor-icons/web"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
        <link rel="stylesheet" href="css/tela_inicial.css">
        <link rel="stylesheet" href="css/global-tema.css">
        <script src="Js/tema.js"></script>
    </head>
    <body>
        <div class="app-container">
            <aside class="sidebar">
                <div class="logo">
                    <a href="tela_inicial.html" class="logo-link">
                        <img src="img/Logo_mini_plus.png" alt="Logo MarIA" class="logo-img">
                    </a>                    
                </div>
                
                <nav class="nav-menu">
                    <ul>
                        <li><a href="agenda.html"><i class="ph-light ph-calendar-dots"></i> <span class="menu-text">Agenda</span></a></li>
                        <li><a href="sala_de_espera.html"><i class="ph-light ph-clock-user"></i> <span class="menu-text">Sala de Espera</span></a></li>
                        <li><a href="pacientes.html"><i class="ph-light ph-users"></i> <span class="menu-text">Pacientes</span></a></li>
                        <li><a href="assinatura_eletronica.html"><i class="ph-light ph-pen-nib"></i> <span class="menu-text">Assinatura Eletrônica</span></a></li>
                        <li><a href="dashboard.html"><i class="ph-light ph-chart-pie-slice"></i> <span class="menu-text">Dashboard</span></a></li>
                        <li id="menu-cadastro" style="display: none;"><a href="cadastro.html"><i class="ph-light ph-folder-plus"></i> <span class="menu-text">Cadastro</span></a></li>
                    </ul>
                </nav>
                
                <nav class="nav-bottom">
                    <ul>
                        <li><a href="informacoes.html"><i class="ph-light ph-info"></i> <span class="menu-text">Sobre</span></a></li>
                        <li><a href="configuracoes.html"><i class="ph-light ph-gear"></i> <span class="menu-text">Configurações</span></a></li>
                        <li><a href="login.html"><i class="ph-light ph-sign-out"></i> <span class="menu-text">Sair</span></a></li>
                    </ul>
                </nav>
            </aside>
            <main class="main-content">
                <header class="top-head">
                    <div class="user-infor">
                        <img class="foto-usuario" src="" style="display: none; width: 50px; height: 50px; border-radius: 50%; object-fit: cover;">
                        <i id="boas-vindas-icone" class="ph-fill ph-user-circle" style="display: block;"></i>
                        <h2 id="boas-vindas-nome">Olá, Dra. Sandra!</h2>
                    </div>
                    <button class="btn-maria-ia">
                        MarIA <i class="ph-fill ph-robot"></i>
                    </button>
                </header>
                <section class="card">
                    <div class="day-summary">
                        <div class="date-titles">
                            <h3 id="data-atual-completa">07 de Abril de 2026</h3>
                            <p>Hoje</p>
                        </div>                        
                        <div class="event-box">
                            <h4>Início de atendimentos</h4>
                            <div class="evento-detalhes">
                                <i class="ph-light ph-calendar-dots"></i>
                                <div class="evento-texto">
                                    <p class="tempo" id="data-hora-atual">Terça-feira, 07 de Abril <i class="ph-fill ph-dot-outline"></i> 09:00</p>
                                    <p class="localização">Clínica Médica</p>
                                </div>
                            </div>
                        </div>
                        <p class="frase">Não esqueça de <strong>beber água</strong> hoje!</p>
                    </div>                    
                    <div class="container-calendario">
                        <input type="text" id="calendario" placeholder="Selecione uma data">
                    </div>                    
                </section>
            </main>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
        <script src="https://npmcdn.com/flatpickr/dist/l10n/pt.js"></script>
        <script src="Js/calendario.js"></script>
        <script src="Js/sidebar.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const usuarioLogado = JSON.parse(localStorage.getItem('usuarioLogado'));
                const nomeEl = document.getElementById('boas-vindas-nome');
                const iconeEl = document.getElementById('boas-vindas-icone');
                const fotos = document.querySelectorAll('.foto-usuario');

                if (usuarioLogado) {
                    if (usuarioLogado.perfil === 'admin') {
                        if (nomeEl) nomeEl.innerText = 'Olá, Marcos!';
                        const config = JSON.parse(localStorage.getItem('maria_config_' + usuarioLogado.email)) || {};
                        if (!config.foto) {
                            fotos.forEach(foto => {
                                foto.src = 'https://ui-avatars.com/api/?name=Marcos+Andrade&background=2D3748&color=fff&size=100';
                                foto.style.display = 'block';
                            });
                            if (iconeEl) iconeEl.style.display = 'none';
                        }
                    } else if (usuarioLogado.perfil === 'recepcao') {
                        const funcionarios = JSON.parse(localStorage.getItem('funcionarios_maria')) || [];
                        const funcionario = funcionarios.find(f => f.email === usuarioLogado.email);
                        if (funcionario) {
                            if (nomeEl) nomeEl.innerText = `Olá, ${funcionario.nome.split(' ')[0]}!`;
                            const config = JSON.parse(localStorage.getItem('maria_config_' + usuarioLogado.email)) || {};
                            if (!config.foto) {
                                fotos.forEach(foto => {
                                    foto.src = funcionario.foto || `https://ui-avatars.com/api/?name=${encodeURIComponent(funcionario.nome)}&background=5DAEE0&color=fff&size=100`;
                                    foto.style.display = 'block';
                                });
                                if (iconeEl) iconeEl.style.display = 'none';
                            }
                        }
                    } else if (usuarioLogado.perfil === 'medico') {
                        const medicos = JSON.parse(localStorage.getItem('medicos_maria')) || [];
                        const medico = medicos.find(m => m.email === usuarioLogado.email);
                        if (medico) {
                            if (nomeEl) {
                                let titulo = medico.sexo === 'Feminino' ? 'Dra.' : 'Dr.';
                                nomeEl.innerText = `Olá, ${titulo} ${medico.nome.split(' ')[0]}!`;
                            }
                            const config = JSON.parse(localStorage.getItem('maria_config_' + usuarioLogado.email)) || {};
                            if (!config.foto) {
                                fotos.forEach(foto => {
                                    foto.src = medico.foto || `https://ui-avatars.com/api/?name=${encodeURIComponent(medico.nome)}&background=5DAEE0&color=fff&size=100`;
                                    foto.style.display = 'block';
                                });
                                if (iconeEl) iconeEl.style.display = 'none';
                            }
                        }
                    }
                }
            });
        </script>
    </body>
</html>
