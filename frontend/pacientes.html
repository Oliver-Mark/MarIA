<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MarIA - Medicina Especializada</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
        <script src="https://unpkg.com/@phosphor-icons/web"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
        <link rel="stylesheet" href="css/pacientes.css">
        <link rel="stylesheet" href="css/global-tema.css">
        <script src="Js/tema.js"></script>
    </head>
    <body>
        <div class="app-container">
            <aside class="sidebar">
                <div class="logo">
                    <a href="tela_inicial.html" class="logo-link">
                        <img src="img/Logo_mini_plus.png" alt="Logo MarIA" class="logo-img">
                    </a>                    
                </div>                
                <nav class="nav-menu">
                    <ul>
                        <li><a href="agenda.html"><i class="ph-light ph-calendar-dots"></i> <span class="menu-text">Agenda</span></a></li>
                        <li><a href="sala_de_espera.html"><i class="ph-light ph-clock-user"></i> <span class="menu-text">Sala de Espera</span></a></li>
                        <li><a href="#" class="active"><i class="ph-light ph-users"></i> <span class="menu-text">Pacientes</span></a></li>
                        <li><a href="assinatura_eletronica.html"><i class="ph-light ph-pen-nib"></i> <span class="menu-text">Assinatura Eletrônica</span></a></li>
                        <li><a href="dashboard.html"><i class="ph-light ph-chart-pie-slice"></i> <span class="menu-text">Dashboard</span></a></li>
                        <li id="menu-cadastro" style="display: none;"><a href="cadastro.html"><i class="ph-light ph-folder-plus"></i> <span class="menu-text">Cadastro</span></a></li>
                    </ul>
                </nav>                
                <nav class="nav-bottom">
                    <ul>
                        <li><a href="informacoes.html"><i class="ph-light ph-info"></i> <span class="menu-text">Sobre</span></a></li>
                        <li><a href="configuracoes.html"><i class="ph-light ph-gear"></i> <span class="menu-text">Configurações</span></a></li>
                        <li><a href="login.html"><i class="ph-light ph-sign-out"></i> <span class="menu-text">Sair</span></a></li>
                    </ul>
                </nav>
            </aside>
            <main class="main-content">
                <div class="ações">
                    <button class="btn-maria-ia">
                        MarIA <i class="ph-fill ph-robot"></i>
                    </button>
                </div>

                <div id="lista-pacientes-view">
                    
                    <div class="secao-pesquisa">
                        <div class="caixa-pesquisa">
                            <input type="text" id="input-pesquisa-paciente" placeholder="Informe o nome ou CPF...">
                            <button class="btn-pesquisar" onclick="pesquisarPacientes()"><i class="ph-bold ph-magnifying-glass"></i> Pesquisar</button>
                        </div>
                        <button class="btn-novo" id="btn-novo-paciente" onclick="abrirNovoPaciente()" style="display: none;"><i class="ph-bold ph-user-plus"></i> Novo Paciente</button>
                    </div>

                    <div class="container-tabela">
                        <table>
                            <thead>
                                <tr>
                                    <th style="width: 50%;">Nome Completo</th>
                                    <th style="width: 30%;">CPF</th>
                                    <th style="width: 20%;">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-lista-pacientes">
                                <!-- Preenchido via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <div id="novo-paciente-view" style="display: none;">
                    <button class="btn-voltar" onclick="voltarParaLista()"><i class="ph-bold ph-arrow-left"></i> Voltar para a pesquisa</button>
                    
                    <div class="card-paciente">
                        <form id="form-novo-paciente">
                            <h3 style="padding: 30px 30px 0 30px; margin-bottom: 0;">Cadastro de Paciente</h3>
                            <div class="secao-cadastro">
                                <div class="foto-paciente" style="width: 150px; height: 150px;">
                                    <img id="foto-novo-paciente-preview" src="https://ui-avatars.com/api/?name=Novo+Paciente&background=E2E8F0&color=A0AEC0&size=150" alt="Foto">
                                </div>
                                <div class="input-group" style="justify-content: center;">
                                    <label>Foto de Perfil (JPG, PNG)</label>
                                    <input type="file" id="foto-novo-paciente" accept=".png, .jpg, .jpeg" onchange="previewFotoNovoPaciente(event)">
                                </div>
                            </div>
                            
                            <div class="secao-outras-informacoes">
                                <h3>Dados Pessoais</h3>
                                <div class="grade-outras-informacoes">
                                    <div class="input-group" style="grid-column: span 2;">
                                        <label>Nome Completo <span class="obrigatorio">*</span></label>
                                        <input type="text" id="nome-paciente" required>
                                    </div>
                                    <div class="input-group">
                                        <label>Data de Nascimento <span class="obrigatorio">*</span></label>
                                        <input type="date" id="data-nasc-paciente" required>
                                    </div>
                                    <div class="input-group">
                                        <label>Sexo <span class="obrigatorio">*</span></label>
                                        <select id="sexo-paciente" required>
                                            <option value="">Selecione...</option>
                                            <option value="Masculino">Masculino</option>
                                            <option value="Feminino">Feminino</option>
                                            <option value="Prefiro não informar">Prefiro não informar</option>
                                        </select>
                                    </div>
                                    <div class="input-group">
                                        <label>CPF <span class="obrigatorio">*</span></label>
                                        <input type="text" id="cpf-paciente" maxlength="14" placeholder="000.000.000-00" required>
                                    </div>
                                    <div class="input-group">
                                        <label>RG</label>
                                        <input type="text" id="rg-paciente">
                                    </div>
                                    <div class="input-group col-contato">
                                        <label>Número de Contato <span class="obrigatorio">*</span></label>
                                        <input type="text" id="contato-paciente" placeholder="(00) 00000-0000" required>
                                    </div>
                                    <div class="input-group col-email">
                                        <label>E-mail</label>
                                        <input type="email" id="email-paciente">
                                    </div>
                                </div>
                            </div>

                            <div class="secao-outras-informacoes" style="border-bottom: none;">
                                <h3>Endereço</h3>
                                <div class="grade-outras-informacoes">
                                    <div class="input-group col-cep">
                                        <label>CEP <span class="obrigatorio">*</span></label>
                                        <input type="text" id="cep-paciente" maxlength="9" onblur="buscarCEPPaciente()" placeholder="Somente números" required>
                                    </div>
                                    <div class="input-group col-logradouro"><label>Logradouro <span class="obrigatorio">*</span></label><input type="text" id="logradouro-paciente" required></div>
                                    <div class="input-group col-numero"><label>Número <span class="obrigatorio">*</span></label><input type="text" id="numero-paciente" required></div>
                                    <div class="input-group col-complemento"><label>Complemento</label><input type="text" id="complemento-paciente"></div>
                                    <div class="input-group col-bairro"><label>Bairro <span class="obrigatorio">*</span></label><input type="text" id="bairro-paciente" required></div>
                                    <div class="input-group col-cidade"><label>Cidade <span class="obrigatorio">*</span></label><input type="text" id="cidade-paciente" required></div>
                                    <div class="input-group col-uf"><label>Estado <span class="obrigatorio">*</span></label><input type="text" id="estado-paciente" required></div>
                                </div>
                                <div style="display: flex; justify-content: flex-end; margin-top: 30px;">
                                    <button type="submit" class="btn-nova" style="font-size: 16px;">Salvar Paciente</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <div id="ficha-paciente-view" style="display: none;">
                    
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <button class="btn-voltar" onclick="voltarParaLista()" style="margin-bottom: 0;"><i class="ph-bold ph-arrow-left"></i> Voltar para a pesquisa</button>
                        <div style="display: flex; gap: 10px;">
                            <button id="btn-editar-paciente" class="btn-novo" style="display: none;" onclick="habilitarEdicaoPaciente()"><i class="ph-bold ph-pencil-simple"></i> Editar</button>
                            <button id="btn-salvar-paciente" class="btn-nova" style="display: none;" onclick="salvarEdicaoPaciente()"><i class="ph-bold ph-check"></i> Salvar</button>
                        </div>
                    </div>

                    <div class="card-paciente">
                        <div class="secao-cadastro">
                            <div class="foto-paciente">
                                <img id="foto-ficha-paciente" src="https://i.pravatar.cc/300?img=11" alt="Foto do paciente">
                            </div>
                            <div class="grade-cadastro">
                                <div class="input-group">
                                    <label for="ficha-nome">Nome do Paciente</label>
                                    <input id="ficha-nome" type="text" readonly>
                                </div>
                                <div class="input-group">
                                    <label for="ficha-data-nasc">Data de nascimento</label>
                                    <input id="ficha-data-nasc" type="date" readonly>
                                </div>
                                <div class="input-group">
                                    <label for="ficha-sexo">Sexo</label>
                                    <select id="ficha-sexo" disabled>
                                        <option value="">Selecione...</option>
                                        <option value="Masculino">Masculino</option>
                                        <option value="Feminino">Feminino</option>
                                        <option value="Prefiro não informar">Prefiro não informar</option>
                                    </select>
                                </div>
                                <div class="input-group">
                                    <label for="ficha-idade">Idade</label>
                                    <input id="ficha-idade" type="text" readonly>
                                </div>
                                <div class="input-group">
                                    <label for="ficha-cpf">CPF</label>
                                    <input id="ficha-cpf" type="text" readonly>
                                </div>
                                <div class="input-group">
                                    <label for="ficha-convenio">Convênio</label>
                                    <input id="ficha-convenio" type="text" value="Particular" readonly>
                                </div>
                            </div>
                        </div>
                        <div class="secao-outras-informacoes">
                            <h3>Outras Informações</h3>
                            <div class="grade-outras-informacoes">
                                <div class="input-group col-cep">
                                    <label for="ficha-cep">CEP</label>
                                    <input id="ficha-cep" type="text" readonly>
                                </div>
                                <div class="input-group col-logradouro">
                                    <label for="ficha-logradouro">Logradouro</label>
                                    <input id="ficha-logradouro" type="text" readonly>
                                </div>
                                <div class="input-group col-numero">
                                    <label for="ficha-numero">Número</label>
                                    <input id="ficha-numero" type="text" readonly>
                                </div>
                                <div class="input-group col-complemento">
                                    <label for="ficha-complemento">Complemento</label>
                                    <input id="ficha-complemento" type="text" readonly>
                                </div>
                                <div class="input-group col-bairro">
                                    <label for="ficha-bairro">Bairro</label>
                                    <input id="ficha-bairro" type="text" readonly>
                                </div>
                                <div class="input-group col-cidade">
                                    <label for="ficha-cidade">Cidade</label>
                                    <input id="ficha-cidade" type="text" readonly>
                                </div>
                                <div class="input-group col-uf">
                                    <label for="ficha-uf">UF</label>
                                    <input id="ficha-uf" type="text" readonly>
                                </div>
                                <div class="input-group col-contato">
                                    <label for="ficha-contato">Número de Contato</label>
                                    <input id="ficha-contato" type="text" readonly>
                                </div>
                                <div class="input-group col-email">
                                    <label for="ficha-email">E-mail</label>
                                    <input id="ficha-email" type="text" readonly>
                                </div>
                                
                            </div>
                        </div>
                        <div class="secao-historico">
                            <div class="header-historico">
                                <h3>Histórico</h3>
                            </div>
                            <div class="lista-historico">
                                <div class="item-historico">
                                    <span class="medico">Dr. Pedro Guimarães</span>
                                    <span class="especialidade"> Oftalmologista</span>
                                    <span class="data"> 12/03/2024</span>
                                    <button class="btn-ver"><i class="ph-bold ph-eye"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </main>
        </div>        

        <script src="Js/app.js"></script>
        <script src="Js/sidebar.js"></script>
    </body>
</html>
